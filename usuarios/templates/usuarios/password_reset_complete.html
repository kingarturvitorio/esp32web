{% extends 'shared/_MainLays.html' %}
{% load static %}

{% block head-content %}
  <title>{{ title }}</title>
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">

          <div class="mb-4">
            <i class="fa fa-check-circle fa-3x text-success"></i>
            <h4 class="mt-3 fw-bold text-success">Senha alterada com sucesso!</h4>
          </div>

          <p class="text-muted">Você será redirecionado automaticamente em <span id="countdown">4</span> segundos...</p>
          <p class="text-muted">Se isso não acontecer, clique no botão abaixo:</p>

          <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">Ir para o login</a>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let count = 4;
  const countdownElement = document.getElementById('countdown');
  const interval = setInterval(() => {
    count--;
    countdownElement.textContent = count;
    if (count === 0) {
      clearInterval(interval);
      window.location.href = "{% url 'login' %}";
    }
  }, 1000);
</script>
{% endblock %}
