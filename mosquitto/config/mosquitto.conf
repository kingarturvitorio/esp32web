persistence true
persistence_location /mosquitto/data/

# Porta MQTT padrão
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets (opcional)
listener 9001
protocol websockets

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
