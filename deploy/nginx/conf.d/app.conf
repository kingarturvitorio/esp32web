# /deploy/nginx/conf.d/app.conf
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;   # troque por seu domínio se quiser

  client_max_body_size 20m;
  sendfile on;

  # (opcional) healthcheck simples
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # Arquivos estáticos e mídias (vindos dos volumes)
  location /static/ { alias /static/;  access_log off;  expires 30d; }
  location /media/  { alias /media/;   access_log off;  expires 30d; }

  # Django (ASGI via Daphne/Uvicorn em web:8000)
  location / {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://web:8000;
  }

  # (opcional) MQTT over WebSockets por caminho /mqtt → mosquitto:9001
  # habilite só se precisar WS externo pela porta 80/443
  # location /mqtt/ {
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade    $http_upgrade;
  #   proxy_set_header Connection $connection_upgrade;
  #   proxy_set_header Host $host;
  #   proxy_buffering off;
  #   rewrite ^/mqtt/(.*)$ /$1 break;
  #   proxy_pass http://mosquitto:9001/;
  # }
}
