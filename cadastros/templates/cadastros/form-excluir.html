{% extends 'dashboard/base_dashboard.html' %}

{%load static}

{% block content %}
<div class="right_col" role="main">
    <div class="">
        <div class="clearfix"></div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <div class="x_panel">
                    <div class="x_title">
                        <h2>Excluir Registro</h2>
                        <div class="clearfix"></div>
                    </div>

                    <div class="x_content">
                        <div class="card">
                            <div class="card-body">

                                <form action="" method="POST">

                                    <p>
                                        Deseja excluir o registro: <strong>{{ object.pk }}</strong>?
                                    </p>
                                    {% csrf_token %}

                                    {{form.as_p}}

                                    <button type="submit" class="btn btn-danger">Excluir</button>

                                </form>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
