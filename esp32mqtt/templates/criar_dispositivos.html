{% extends 'dashboard/base.html' %}

{% block content %}

{% load crispy_forms_tags %}


<div class="container mt=4">
  <h3 class="display-7">Criar dispositivo</h3>

  <div class="col-md-2">
    <h2>{{ view.object.pk|yesno:"Editar,Adicionar" }} Dispositivo</h2>
  </div>

  <div class="card">
      <div class="card-body">
          <form method="post" class="form">
              {% csrf_token %}
              {{ form|crispy }}
              <button type="submit" class="btn btn-primary">Salvar Dispositivo</button>
          </form>
      </div>
  </div>
  <a href="{% url 'lista-dispositivos' %}" class="btn btn-secondary mt-3">Cancelar e voltar para Lista</a>
</div>


{% endblock %}
