{% extends 'dashboard/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="mt-4">

  <!-- Título e ação -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h1 class="h3 fw-bold">
      <i class="bi bi-plus-circle-fill me-2 text-primary"></i>
      {{ view.object.pk|yesno:"Editar,Adicionar" }} Dispositivo
    </h1>
  </div>

  <!-- Formulário -->
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">Salvar Dispositivo</button>
          <a href="{% url 'lista-dispositivos' %}" class="btn btn-secondary">Cancelar e voltar para Lista</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
