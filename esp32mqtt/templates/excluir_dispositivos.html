{% extends 'dashboard/base_dashboard.html' %}

{% load static %}

{% block content %}
<div class="right_col" role="main">
    <div class="">
        <div class="page-title">
            <div class="title_left">
                <h3>Editar Dispositivo</h3>
            </div>
        </div>
        <div class="clearfix"></div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <div class="x_panel">
                    <div class="x_title">

                        <div class="col-md-2">
                            <h2>Tem certeza que deseja remover o dispositivo "{{ object.nome }}"?</h2>
                        </div>
                        <div class="clearfix"></div>
                    </div>
                    <div class="x_content">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit">Confirmar</button>
                        </form>
                        <a href="{% url 'lista-dispositivos' %}">Cancelar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
