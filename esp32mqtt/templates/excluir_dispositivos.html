{% extends 'dashboard/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="mt-4">

  <!-- Título -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h1 class="h3 fw-bold text-danger">
      <i class="bi bi-trash-fill me-2"></i>
      Deletar Dispositivo
    </h1>
  </div>

  <!-- Card de confirmação -->
  <div class="card border-danger shadow-sm">
    <div class="card-body">
      <p class="card-text fs-5">
        Tem certeza que deseja excluir o dispositivo
        <strong>{{ object.nome }}</strong>?
        Essa ação não pode ser desfeita.
      </p>

      <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Sim, deletar</button>
          <a href="{% url 'lista-dispositivos' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
